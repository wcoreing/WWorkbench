# 在 Linux 上打桌面包（GTK/WebKit 无法从 macOS 交叉编译），挂到已有 GitHub Release。
# 本机发版仍只上传 darwin zip；本 workflow 在 release published 后自动补 linux/amd64。
name: release-linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传的 Release tag，例如 v0.54.73"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK / WebKit 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build linux/amd64
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Zip binary
        run: |
          test -n "$TAG"
          test -x build/bin/WWorkbench
          cd build/bin
          zip -9 "../../WWorkbench-${TAG}-linux-amd64.zip" WWorkbench

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "WWorkbench-${TAG}-linux-amd64.zip" --clobber
          echo "runtime: Ubuntu 22.04+ / 同类发行版，需 libgtk-3-0 与 libwebkit2gtk-4.1-0"
